[project]
name = "capitation-recon"
version = "0.1.0"
description = "AI-driven capitation revenue reconciliation (prototype on synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.80",
    "streamlit>=1.35",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "common*", "data_gen*", "engine*", "evals*", "governance*", "llm*", "privacy*",
           "schemas*", "storage*", "workflow*"]

[tool.setuptools.package-data]
storage = ["schema.sql"]
llm = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
